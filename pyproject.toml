[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netmeter"
version = "0.1.0"
description = "Measure download speed from your machine with sequential HTTP requests"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Dmitriy Pereguda" }]
dependencies = []

[project.scripts]
netmeter = "netmeter.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/netmeter"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
